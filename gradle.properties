org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Pure Java module: do not pull Kotlin's stdlib into the APK.
android.builtInKotlin=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# The project lives under C:\codes\模块\..., which AGP refuses by default on
# Windows even though the build itself works (the old build.ps1 also staged to
# C:\wcg_build for the same reason).
android.overridePathCheck=true
